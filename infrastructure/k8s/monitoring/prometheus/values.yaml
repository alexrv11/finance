# kube-prometheus-stack Helm values
# Chart: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
# Install: helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#            -n monitoring -f values.yaml

fullnameOverride: prometheus

# ── Grafana ──────────────────────────────────────────────────────────────────
grafana:
  enabled: true
  adminPassword: changeme   # override via secret in production

  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana"
    auth.anonymous:
      enabled: false

  # Pre-configure all datasources so Grafana is ready out of the box
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
      jsonData:
        derivedFields:
          - datasourceUid: tempo
            matcherRegex: '"x_request_id":"([^"]+)"'
            name: TraceID
            url: "$${__value.raw}"

    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.monitoring.svc.cluster.local:3200
      access: proxy
      isDefault: false
      jsonData:
        httpMethod: GET
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: finance
          orgId: 1
          folder: Finance
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/finance

  # Import community dashboards by ID
  dashboards:
    default:
      envoy-dashboard:
        gnetId: 11022    # Envoy proxy dashboard
        revision: 1
        datasource: Prometheus
      kubernetes-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus
      kubernetes-pods:
        gnetId: 6336
        revision: 1
        datasource: Prometheus

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # Scrape all namespaces
    podMonitorNamespaceSelector: {}
    serviceMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}

    # Additional scrape configs for services that use pod annotations
    additionalScrapeConfigs:
      # Envoy admin stats (/stats/prometheus)
      - job_name: envoy
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [finance]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: envoy
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "$1:9901"
          - target_label: __metrics_path__
            replacement: /stats/prometheus

      # Finance microservices metrics (port 9090)
      - job_name: finance-services
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [finance]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: "$1"
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+);(.+)
            replacement: "$1:$2"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service

# ── AlertManager ──────────────────────────────────────────────────────────────
alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: [alertname, service]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "null"   # replace with slack/pagerduty in production
    receivers:
      - name: "null"

# ── Node exporter + kube-state-metrics ───────────────────────────────────────
nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

# Default alert rules
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false         # not accessible in managed EKS
    kubeApiserver: true
    kubeProxy: false    # not accessible in managed EKS
    kubeScheduler: false
    node: true
    prometheus: true
