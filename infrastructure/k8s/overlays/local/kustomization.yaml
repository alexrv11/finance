apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Patch Envoy to NodePort so it is reachable at localhost:8080
# Patch PVC to use kind's default storageClass
# Scale services down to 1 replica to save local resources
patches:
  - path: patches/envoy-service.yaml
  - path: patches/seed-pvc.yaml
  - path: patches/replicas.yaml

# Images are built locally and loaded into kind via:
#   docker build -t finance/<service>:local services/<service>/
#   kind load docker-image finance/<service>:local --name finance-local
images:
  - name: finance/seed
    newTag: local
  - name: finance/analytics
    newTag: local
  - name: finance/alert
    newTag: local

configMapGenerator:
  - name: service-config
    behavior: merge
    literals:
      - ENVIRONMENT=local
