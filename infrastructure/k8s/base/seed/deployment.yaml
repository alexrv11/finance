apiVersion: apps/v1
kind: Deployment
metadata:
  name: seed
  namespace: finance
  labels:
    app: seed
    layer: data
spec:
  replicas: 1   # single replica — DuckDB is not distributed
  selector:
    matchLabels:
      app: seed
  template:
    metadata:
      labels:
        app: seed
        layer: data
    spec:
      containers:
        - name: seed
          image: finance/seed:latest
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: GRPC_PORT
              value: "50051"
            - name: DB_PATH
              value: "/data/finance.duckdb"
          envFrom:
            - configMapRef:
                name: service-config
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seed-data
