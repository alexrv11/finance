apiVersion: v1
kind: Service
metadata:
  name: seed
  namespace: finance
  labels:
    app: seed
spec:
  type: ClusterIP
  selector:
    app: seed
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
