apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: seed
  namespace: finance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: seed
  # seed uses DuckDB (file-based) so it cannot scale beyond 1 horizontally.
  # HPA is defined for completeness and will keep replicas pinned at 1.
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
