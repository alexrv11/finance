apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: finance

resources:
  - namespace.yaml
  - configmap.yaml
  # envoy — API gateway (replaces custom api-gateway service)
  - envoy/configmap.yaml
  - envoy/deployment.yaml
  - envoy/service.yaml
  # seed — data ingestion (replicas pinned at 1, DuckDB file lock)
  - seed/pvc.yaml
  - seed/deployment.yaml
  - seed/service.yaml
  - seed/hpa.yaml
  # analytics — indicator computation
  - analytics/deployment.yaml
  - analytics/service.yaml
  - analytics/hpa.yaml
  # alert — watchlists and notifications
  - alert/deployment.yaml
  - alert/service.yaml
  - alert/hpa.yaml
