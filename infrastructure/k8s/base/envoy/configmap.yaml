apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: finance
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901

    static_resources:

      # ── Listeners ──────────────────────────────────────────────────────────
      listeners:
        - name: ingress
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8080
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    use_remote_address: true
                    generate_request_id: true

                    # Distributed tracing → Tempo (Zipkin-compatible endpoint)
                    tracing:
                      provider:
                        name: envoy.tracers.zipkin
                        typed_config:
                          "@type": type.googleapis.com/envoy.config.trace.v3.ZipkinConfig
                          collector_cluster: tempo
                          collector_endpoint: "/api/v2/spans"
                          collector_endpoint_version: HTTP_JSON
                          shared_span_context: false

                    # Structured JSON access logs → stdout (collected by Promtail)
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              start_time:            "%START_TIME%"
                              method:                "%REQ(:METHOD)%"
                              path:                  "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                              protocol:              "%PROTOCOL%"
                              response_code:         "%RESPONSE_CODE%"
                              response_flags:        "%RESPONSE_FLAGS%"
                              duration_ms:           "%DURATION%"
                              upstream_cluster:      "%UPSTREAM_CLUSTER%"
                              x_request_id:          "%REQ(X-REQUEST-ID)%"
                              upstream_host:         "%UPSTREAM_HOST%"

                    http_filters:
                      # gRPC-Web support — allows browser clients to call gRPC services
                      - name: envoy.filters.http.grpc_web
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb

                      # CORS — adjust allowed origins per environment
                      - name: envoy.filters.http.cors
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors

                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                          start_child_span: true

                    route_config:
                      name: finance_routes
                      virtual_hosts:
                        - name: finance
                          domains: ["*"]
                          cors:
                            allow_origin_string_match:
                              - safe_regex:
                                  regex: ".*"
                            allow_methods: "GET, POST, OPTIONS"
                            allow_headers: "content-type, x-grpc-web, authorization, grpc-timeout"
                            expose_headers: "grpc-status, grpc-message"

                          routes:
                            # Health check — direct response, no upstream needed
                            - match:
                                prefix: "/health"
                              direct_response:
                                status: 200
                                body:
                                  inline_string: '{"status":"ok"}'
                              response_headers_to_add:
                                - header:
                                    key: content-type
                                    value: application/json

                            # Seed — prices and ingest (HTTP, current Gin REST API)
                            - match:
                                prefix: "/api/v1/prices"
                              route:
                                cluster: seed_http
                                timeout: 30s
                                retry_policy:
                                  retry_on: gateway-error,reset
                                  num_retries: 2

                            - match:
                                prefix: "/api/v1/ingest"
                              route:
                                cluster: seed_http
                                timeout: 60s

                            # Analytics — indicators (gRPC)
                            - match:
                                prefix: "/api/v1/indicators"
                              route:
                                cluster: analytics_grpc
                                timeout: 30s
                                retry_policy:
                                  retry_on: gateway-error,reset,retriable-status-codes
                                  retriable_status_codes: [14]   # gRPC UNAVAILABLE
                                  num_retries: 2

                            # Alert — watchlists and alerts (gRPC)
                            - match:
                                prefix: "/api/v1/alerts"
                              route:
                                cluster: alert_grpc
                                timeout: 30s
                                retry_policy:
                                  retry_on: gateway-error,reset
                                  num_retries: 2

      # ── Clusters ───────────────────────────────────────────────────────────
      clusters:
        # Seed HTTP (current REST/Gin server)
        - name: seed_http
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: LEAST_REQUEST
          load_assignment:
            cluster_name: seed_http
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: seed.finance.svc.cluster.local
                          port_value: 8080
          health_checks:
            - timeout: 5s
              interval: 10s
              unhealthy_threshold: 2
              healthy_threshold: 1
              http_health_check:
                path: /health
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 100
                max_requests: 1000

        # Analytics gRPC
        - name: analytics_grpc
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: LEAST_REQUEST
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: analytics_grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: analytics.finance.svc.cluster.local
                          port_value: 50052
          health_checks:
            - timeout: 5s
              interval: 10s
              unhealthy_threshold: 2
              healthy_threshold: 1
              grpc_health_check:
                service_name: "analytics"
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 100
                max_requests: 1000

        # Alert gRPC
        - name: alert_grpc
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: LEAST_REQUEST
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: alert_grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: alert.finance.svc.cluster.local
                          port_value: 50053
          health_checks:
            - timeout: 5s
              interval: 10s
              unhealthy_threshold: 2
              healthy_threshold: 1
              grpc_health_check:
                service_name: "alert"
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 100
                max_requests: 1000

        # Tempo — receives traces from Envoy via Zipkin protocol
        - name: tempo
          connect_timeout: 5s
          type: STRICT_DNS
          load_assignment:
            cluster_name: tempo
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: tempo.monitoring.svc.cluster.local
                          port_value: 9411
