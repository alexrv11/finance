apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: finance
  labels:
    app: api-gateway
    layer: edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        layer: edge
    spec:
      containers:
        - name: api-gateway
          image: finance/api-gateway:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50050
              protocol: TCP
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: GRPC_PORT
              value: "50050"
          envFrom:
            - configMapRef:
                name: service-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
