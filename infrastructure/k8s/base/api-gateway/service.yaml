apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: finance
  labels:
    app: api-gateway
spec:
  # Type is patched per environment:
  #   local → NodePort (30080)
  #   aws   → LoadBalancer (ALB via AWS LB controller)
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 50050
      targetPort: grpc
      protocol: TCP
